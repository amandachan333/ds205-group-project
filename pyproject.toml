[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data",
    "logs",
    "reports",
    "notebooks",
    ".venv",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names — catches real bugs)
    "I",   # isort (consistent import ordering)
    "UP",  # pyupgrade (modernise to py3.11 idioms)
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line-too-long — let the formatter handle this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"