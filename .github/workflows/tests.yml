name: Tests

# Run on every push to main AND on every PR opened against main.
# PR runs are the more important one — they catch breakage *before* it lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # cache wheels between runs for faster CI

      - name: Install test dependencies
        # Minimal set — just what the unit tests actually need to import.
        # If a test starts failing because something in config.py / utils.py
        # / chunk.py needs an extra package at import time, add it here.
        run: |
          python -m pip install --upgrade pip
          pip install pytest nltk python-dotenv

      - name: Run pytest
        run: pytest