[pytest]
# Discover tests under tests/.  Standard naming: test_*.py / test_*.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# -ra: short summary of failures at the end of the run
# -q : quieter per-test output (dots instead of names)
addopts = -ra -q

# Silence pytest's deprecation chatter from third-party libs
filterwarnings =
    ignore::DeprecationWarning